openapi: 3.0.3
info:
  title: EShop SUT API Specification
  description: API Specification converted to OpenAPI 3.0 format for HW06 (Student 23127327 - Lưu Ngô Quốc Bảo)
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: Local SUT Backend Server

paths:
  /api/products:
    get:
      summary: Lấy danh sách sản phẩm
      description: Trả về danh sách toàn bộ sản phẩm trong hệ thống
      parameters:
        - name: X-Student-Id
          in: header
          required: false
          schema:
            type: string
            example: "23127327"
      responses:
        '200':
          description: Danh sách sản phẩm thành công
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'

  /api/products/{id}:
    get:
      summary: Xem chi tiết sản phẩm
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Chi tiết sản phẩm
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          description: Sản phẩm không tồn tại

  /api/login:
    post:
      summary: Xác thực đăng nhập (FR-02)
      description: Đăng nhập cấp phát JWT token và đối tượng user. Khóa 30s nếu sai từ 3 lần liên tiếp.
      parameters:
        - name: X-Student-Id
          in: header
          schema:
            type: string
            example: "23127327"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: "test@eshop.com"
                password:
                  type: string
                  format: password
                  example: "Test1234!"
      responses:
        '200':
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Login successful"
                  token:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          description: Dữ liệu đầu vào không hợp lệ
        '401':
          description: Sai email hoặc mật khẩu
        '403':
          description: Tài khoản tạm khóa do đăng nhập sai nhiều lần

  /api/cart:
    get:
      summary: Lấy giỏ hàng của người dùng (FR-07)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Danh sách sản phẩm trong giỏ hàng
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    productId:
                      type: integer
                    quantity:
                      type: integer
    post:
      summary: Thêm sản phẩm vào giỏ hàng
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - productId
                - quantity
              properties:
                productId:
                  type: integer
                quantity:
                  type: integer
      responses:
        '200':
          description: Thêm vào giỏ thành công

  /api/checkout:
    post:
      summary: Đặt hàng & Thanh toán (FR-08)
      description: Thanh toán giỏ hàng, tính toán tổng tiền và làm rỗng giỏ hàng
      security:
        - bearerAuth: []
      parameters:
        - name: X-Student-Id
          in: header
          schema:
            type: string
            example: "23127327"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - total_amount
                - shipping_address
              properties:
                total_amount:
                  type: number
                  example: 30000000
                shipping_address:
                  type: string
                  example: "123 Le Loi, Q1, TP.HCM"
      responses:
        '200':
          description: Đặt hàng thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Checkout successful"
                  orderId:
                    type: integer
        '400':
          description: Giỏ hàng rỗng hoặc dữ liệu không hợp lệ

  /api/categories:
    get:
      summary: Danh sách danh mục sản phẩm (FR-14)
      responses:
        '200':
          description: Danh sách danh mục
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
    post:
      summary: Tạo danh mục mới (Admin only - FR-12 / FR-14)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  example: "Đồng hồ thông minh"
      responses:
        '200':
          description: Tạo danh mục thành công
        '400':
          description: Tên danh mục rỗng hoặc không hợp lệ
        '403':
          description: Không có quyền Admin (SEC-03)

  /api/categories/{id}:
    put:
      summary: Cập nhật tên danh mục (Admin only - FR-14)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
      responses:
        '200':
          description: Cập nhật thành công
        '403':
          description: Không có quyền Admin
        '404':
          description: Danh mục không tồn tại
    delete:
      summary: Xóa danh mục (Admin only - FR-14)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Xóa danh mục thành công
        '400':
          description: Không thể xóa danh mục đang có sản phẩm
        '403':
          description: Không có quyền Admin
        '404':
          description: Danh mục không tồn tại

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Product:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        price:
          type: number
        description:
          type: string
        imageUrl:
          type: string
        category_id:
          type: integer

    Category:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string

    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [user, admin]
